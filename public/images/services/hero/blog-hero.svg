<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="600" viewBox="0 0 1920 600">
  <defs>
    <linearGradient id="blogHero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <pattern id="blogGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="60" y2="0" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
      <line x1="0" y1="0" x2="0" y2="60" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <rect width="1920" height="600" fill="url(#blogHero)"/>
  <rect width="1920" height="600" fill="url(#blogGrid)"/>
  
  <!-- Book Icon -->
  <g transform="translate(960, 250)" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="3">
    <path d="M-80 -100 Q0 -120 80 -100 L80 100 Q0 80 -80 100 Z"/>
    <line x1="0" y1="-100" x2="0" y2="100"/>
    <line x1="-60" y1="-60" x2="60" y2="-60"/>
    <line x1="-60" y1="-20" x2="60" y2="-20"/>
    <line x1="-60" y1="20" x2="60" y2="20"/>
    <line x1="-60" y1="60" x2="60" y2="60"/>
  </g>
  
  <!-- Pen Icon -->
  <g transform="translate(300, 200)" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2">
    <path d="M0 -80 L20 60 L0 80 L-20 60 Z"/>
    <line x1="0" y1="-80" x2="0" y2="80"/>
  </g>
  
  <!-- Quote Icon -->
  <g transform="translate(1600, 350)" fill="rgba(255,255,255,0.15)">
    <text x="0" y="0" font-size="120" font-family="Arial" text-anchor="middle">"</text>
  </g>
  
  <text x="960" y="550" text-anchor="middle" fill="rgba(255,255,255,0.08)" font-size="24" font-family="Arial">
    Engineering Insights & Articles
  </text>
</svg>